name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: CI (backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "backend/go.mod"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install build deps (CGO)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential && sudo rm -rf /var/lib/apt/lists/*

      - name: Go test (sqlite_fts5)
        working-directory: backend
        run: go test -tags sqlite_fts5 ./...

  kit:
    name: CI (kit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "kit/.nvmrc"
          cache: "npm"
          cache-dependency-path: "kit/package-lock.json"

      - name: Install
        working-directory: kit
        run: npm ci

      - name: Test
        working-directory: kit
        run: npm test

      - name: Build
        working-directory: kit
        run: npm run build

      - name: Build production image
        run: docker build -t memo-studio:ci .

      - name: Exercise the production SPA in Chrome
        run: |
          export MEMO_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          docker run -d --name smoke -p 127.0.0.1:9000:9000 -e MEMO_ADMIN_PASSWORD memo-studio:ci
          trap 'docker rm -fv smoke' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:9000/health
          python3 -m venv "$RUNNER_TEMP/smoke-env"
          "$RUNNER_TEMP/smoke-env/bin/pip" -q install playwright==1.56.0
          "$RUNNER_TEMP/smoke-env/bin/python" scripts/smoke-kit.py
